<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>13 · Neubrutalism · 뉴브루탈리즘</title>
<!--
EFFECT: Neubrutalism (뉴브루탈리즘)
느낌: 두꺼운 검정 테두리, 번짐 없는 그림자, 쨍한 원색 — 솔직하고 장난스러운 '날것'의 인터페이스
잘 맞는 곳: 스타트업·크리에이터 랜딩, CTA 버튼, 가격/구독 카드, 뉴스레터 폼, 배지·태그, 프로모션 띠 배너
피해야 할 곳: 럭셔리·고급 브랜드, 정보 밀도 높은 대시보드·표, 차분해야 하는 의료·금융 서비스
핵심 기법:
  - border: var(--bw) solid #000 + box-shadow: var(--off) var(--off) 0 #000 (blur 0 = 하드 섀도)
  - 눌림: :active에서 translate(var(--off), var(--off)) + 그림자 0 → 버튼이 바닥에 '딸깍' 닿는 느낌
  - 무한 띠 배너(marquee): 같은 내용을 2번 이어 붙이고 translateX(-50%) 반복
  - 스티커 흔들기(wiggle): rotate 키프레임
조절 포인트:
  - --bw: 테두리 두께 / --off: 그림자 오프셋(= 눌림 거리) / --radius: 모서리
  - --yellow / --pink / --lime / --blue: 플랫 컬러 팔레트
  - --press: 눌림 전환 시간(짧을수록 기계적) / --marquee: 띠 배너 한 바퀴 시간
  ※ --shadow는 :root에서 계산되므로 --off를 바꿀 땐 :root에서 바꾸기
성능: 가벼움 — 그림자에 blur가 없어 페인트 비용이 낮고, 움직임은 transform/translate/rotate뿐
접근성: prefers-reduced-motion이면 띠 배너·스티커 정지(정적 배치), 버튼 눌림은 즉시 상태 변화만.
        모든 텍스트는 검정 on 원색/흰색(대비 7:1 이상). 포커스는 점선 아웃라인, 입력창은 배경·그림자 변화도 함께
이식 메모:
  - Tailwind: border-[3px] border-black shadow-[6px_6px_0_#000] active:translate-x-[6px] active:translate-y-[6px] active:shadow-none
  - React: 순수 CSS라 상태 불필요 — 폼 제출 피드백만 useState
  - Next.js: 서버 컴포넌트 그대로 사용 가능(marquee 포함 JS 없음), onSubmit 핸들러만 클라이언트로
  - 띠 배너 복제본에는 aria-hidden="true" (스크린리더 중복 낭독 방지)
-->
<style>
  :root{
    --bg:#fff4d6; --ink:#111; --paper:#fff;
    --yellow:#ffd23f; --pink:#ff7eb6; --lime:#b8f04a; --blue:#7b9cff;
    --bw:3px; --off:6px; --radius:12px; --press:.08s; --marquee:16s;
    --shadow:var(--off) var(--off) 0 var(--ink);
    --sans:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  html,body{margin:0;height:100%}
  body{display:grid;place-items:center;overflow:hidden;color:var(--ink);font-family:var(--sans);
    background:radial-gradient(rgba(17,17,17,.16) 1.2px,transparent 1.7px) 0 0/22px 22px,var(--bg)}
  .demo{box-sizing:border-box;width:min(90vw,440px);display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(16px,4.4vmin,28px)}

  /* ── 띠 배너(marquee) ── */
  .marquee{overflow:hidden;rotate:-2deg;background:var(--pink);border:var(--bw) solid var(--ink);box-shadow:4px 4px 0 var(--ink);
    font:900 clamp(11px,2.8vmin,14px)/1 var(--sans);letter-spacing:.06em;text-transform:uppercase}
  .track{display:flex;width:max-content;animation:marquee var(--marquee) linear infinite}
  .track span{padding:.75em 1.2em .75em 0;white-space:nowrap}
  @keyframes marquee{to{transform:translateX(-50%)}}

  /* ── 카드 ── */
  .card{position:relative;display:grid;gap:clamp(8px,2.4vmin,14px);padding:clamp(14px,4.2vmin,28px);
    background:var(--paper);border:var(--bw) solid var(--ink);border-radius:var(--radius);box-shadow:var(--shadow)}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
  .badges li{font:800 clamp(10px,2.4vmin,12px)/1 var(--sans);letter-spacing:.04em;padding:.45em .75em;
    border:2px solid var(--ink);border-radius:999px;background:var(--c)}
  h1{margin:0;font:900 clamp(21px,6.2vmin,38px)/1.1 var(--sans);letter-spacing:-.03em}
  h1 mark{display:inline-block;rotate:-3deg;padding:0 .15em;color:inherit;background:var(--lime);
    border:var(--bw) solid var(--ink);border-radius:6px}
  .desc{margin:0;font:500 clamp(12px,3vmin,15px)/1.45 var(--sans)}
  .sticker{position:absolute;top:calc(clamp(18px,5vmin,30px) * -1);right:clamp(12px,3.4vmin,22px);
    width:clamp(52px,14vmin,80px);aspect-ratio:1;display:grid;place-items:center;
    background:var(--blue);border:var(--bw) solid var(--ink);border-radius:50%;box-shadow:3px 3px 0 var(--ink);
    font:900 clamp(11px,2.8vmin,15px)/1 var(--sans);rotate:10deg;animation:wiggle 2.4s ease-in-out infinite}
  @keyframes wiggle{0%,100%{rotate:10deg}50%{rotate:-8deg}}

  /* ── 입력창 + 버튼 (효과 핵심: 하드 섀도 & 눌림) ── */
  .form{display:flex;flex-wrap:wrap;gap:10px}
  .input{flex:1 1 9em;min-width:0;box-sizing:border-box;font:600 clamp(13px,3.1vmin,15px)/1.2 var(--sans);color:var(--ink);
    padding:.75em .9em;background:#fffdf3;border:var(--bw) solid var(--ink);border-radius:8px;
    transition:box-shadow var(--press),translate var(--press),background-color .15s}
  .input::placeholder{color:#6b6b6b}
  .input:focus-visible{background:#fff6c7;box-shadow:4px 4px 0 var(--ink);translate:-2px -2px}
  .btn{font:900 clamp(13px,3.2vmin,16px)/1.2 var(--sans);color:var(--ink);cursor:pointer;
    padding:.75em 1.15em;background:var(--yellow);border:var(--bw) solid var(--ink);border-radius:8px;box-shadow:var(--shadow);
    transition:translate var(--press) ease-out,box-shadow var(--press) ease-out,background-color .15s}
  .btn:hover{background:var(--lime);translate:-2px -2px;box-shadow:calc(var(--off) + 2px) calc(var(--off) + 2px) 0 var(--ink)}
  .btn:active{translate:var(--off) var(--off);box-shadow:0 0 0 var(--ink)}      /* 딸깍: 그림자 자리로 내려앉음 */
  :is(.btn,.input):focus-visible{outline:3px dashed var(--ink);outline-offset:4px}

  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .tag{position:fixed;left:12px;bottom:12px;z-index:10;margin:0;font:600 11px/1 system-ui;letter-spacing:.04em;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;}

  @media (prefers-reduced-motion:reduce){
    .track,.sticker{animation:none}
    .btn,.input{transition:none}
  }
</style>
</head>
<body>
  <main class="demo">
    <div class="marquee">
      <div class="track">
        <span>NEW DROP ✦ 매주 금요일 발송 ✦ 광고 0% ✦ 1.2만 명 구독 중 ✦</span>
        <span aria-hidden="true">NEW DROP ✦ 매주 금요일 발송 ✦ 광고 0% ✦ 1.2만 명 구독 중 ✦</span>
      </div>
    </div>

    <section class="card" aria-labelledby="title">
      <span class="sticker" aria-hidden="true">NEW!</span>
      <ul class="badges" aria-label="태그">
        <li style="--c:var(--yellow)">WEEKLY</li>
        <li style="--c:var(--pink)">무료</li>
        <li style="--c:var(--blue)">디자인</li>
      </ul>
      <h1 id="title">디자인 링크,<br>딱 <mark>5개</mark>만.</h1>
      <p class="desc">광고도 군더더기도 없이. 매주 금요일 아침, 메일함에서 만나요.</p>
      <form class="form">
        <label class="sr-only" for="email">이메일 주소</label>
        <input class="input" id="email" type="email" placeholder="you@email.com" autocomplete="email" required>
        <button class="btn" type="submit">구독하기</button>
      </form>
      <p class="sr-only" role="status" id="status"></p>
    </section>
  </main>
  <p class="tag">13 · Neubrutalism</p>

  <script>
  // 데모용 제출 피드백 (실제 전송 없음) — 눌림 효과 자체는 CSS :active만으로 동작
  const form = document.querySelector('.form');
  const btn = form.querySelector('.btn');
  form.addEventListener('submit', e => {
    e.preventDefault();
    btn.textContent = '완료! ✓';
    document.getElementById('status').textContent = '구독 신청이 완료되었습니다.';
    form.reset();
    setTimeout(() => { btn.textContent = '구독하기'; }, 1800);
  });
  </script>
</body>
</html>
