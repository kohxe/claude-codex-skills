<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>04 · Halftone · 하프톤</title>
<!--
EFFECT: Halftone (하프톤)
느낌: 옛날 만화책·팝아트 인쇄처럼 점으로 찍어낸 그래픽 — 레트로하고 경쾌함
잘 맞는 곳: 히어로 배경 그래픽, 캠페인·이벤트 배너, 잡지형 에디토리얼 섹션, 404·빈 상태 일러스트
피해야 할 곳: 본문 텍스트 바로 뒤(점 패턴이 글자를 깨뜨림), 제품 사진, 작은 썸네일·아이콘
핵심 기법:
  - 원본 장면(빛이 도는 구 + 고리)을 오프스크린 캔버스에 '셀당 2px' 저해상도로 그림 → getImageData 한 번으로 밝기 샘플
  - 45° 회전 격자의 점마다 반지름 = 최대반지름 × √(어두움)  (점 면적 ∝ 어두움 → 톤이 자연스러움)
  - 모든 점을 path 하나에 모아 fill() 1회 → 수천 개도 가벼움
  - ResizeObserver(크기 대응), IntersectionObserver + visibilitychange(정지), devicePixelRatio 최대 2
조절 포인트:
  - --paper / --ink / --cream: 바탕·점·패널 색 (JS 가 CSS 변수를 읽음)
  - ANGLE: 망점 각도(π/4 = 45°, 0 = 정격자), DOT: 점 최대 크기(0.71 이상이면 가장 어두운 곳이 꽉 참)
  - resize() 의 cell 식: 망점 간격, FPS: 갱신 빈도(30), SPEED: 빛 회전 속도
  - scene(): 이 함수만 바꾸면 무엇이든 하프톤 (drawImage 로 사진·로고, fillText 로 글자도 가능)
성능: 보통 — 저해상도 원본 + path 1회 fill 이라 1080p 에서도 가벼운 편. cell 을 너무 작게(4px 미만) 하면 점 수가 제곱으로 늘어남
접근성: prefers-reduced-motion 이면 빛이 왼쪽 위에 있는 정지 프레임 1장만 그림(크기 변경 시에만 다시 그림). 캔버스는 aria-hidden 장식, 글자는 HTML 패널(크림 바탕 + 검정 잉크)에 둬서 대비 확보
이식 메모:
  - React: useEffect 안에서 캔버스 세팅 + 루프 시작, cleanup 에서 cancelAnimationFrame·ResizeObserver/IntersectionObserver disconnect (StrictMode 이중 실행 대비)
  - Next.js: 'use client'. 캔버스는 마운트 후에만 그림
  - Tailwind: 패널·버튼만 유틸리티로, 캔버스는 absolute inset-0 h-full w-full
CSS 전용 대안 (정적이고 가벼운 하프톤이면 캔버스 없이):
  A) 점 패턴 + 마스크 — 점 크기는 같고 농도만 변함 (바탕색은 부모에)
     .halftone-css {
       background: radial-gradient(circle, #16110d 32%, transparent 34%) 0 0 / 10px 10px;
       -webkit-mask-image: radial-gradient(circle at 35% 35%, transparent 12%, #000 72%);
               mask-image: radial-gradient(circle at 35% 35%, transparent 12%, #000 72%);
     }
  B) 점 크기까지 변하게 — 흐린 점 × 그라디언트를 곱한 뒤 contrast 로 문턱 처리 (흑백 결과)
     .halftone-css-b {
       background: radial-gradient(closest-side, #777, #fff) 0 0 / 10px 10px,
                   radial-gradient(circle at 35% 35%, #fff, #000);
       background-blend-mode: multiply;
       filter: contrast(18);   /* 흰 바탕→주황: 위에 #ff7a1a 레이어를 mix-blend-mode: multiply 로 얹음 */
     }
-->
<style>
  :root{
    --paper:#ff7a1a;   /* 바탕(점이 없는 곳) */
    --ink:#16110d;     /* 점 색 */
    --cream:#fff2d9;   /* 패널 */
  }
  html,body{margin:0;height:100%}
  body{background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  .demo{position:relative;height:100%;overflow:hidden}
  .halftone{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* 만화 내레이션 패널 + 버튼 (텍스트는 캔버스가 아닌 HTML 로) */
  .panel{position:absolute;left:clamp(12px,4vmin,40px);top:clamp(12px,4vmin,40px);max-width:min(62%,440px);padding:.7em .95em .8em;
    background:var(--cream);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);transform:rotate(-1.5deg)}
  .panel__kicker{display:inline-block;margin:0 0 .55em;padding:.3em .55em;background:var(--ink);color:var(--cream);
    font-weight:800;font-size:clamp(9px,1.9vmin,12px);letter-spacing:.16em}
  .panel h1{margin:0;font-weight:900;font-size:clamp(20px,6.2vmin,58px);line-height:1.04;letter-spacing:-.02em}
  .cta{position:absolute;right:clamp(12px,4vmin,40px);bottom:clamp(12px,4vmin,40px);padding:.7em 1.2em;cursor:pointer;
    font:inherit;font-weight:900;font-size:clamp(13px,2.6vmin,18px);color:var(--ink);
    background:var(--cream);border:3px solid var(--ink);border-radius:999px;box-shadow:4px 4px 0 var(--ink);
    transition:transform .12s ease,box-shadow .12s ease}
  .cta:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
  .cta:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
  .cta:focus-visible{outline:4px solid #fff;outline-offset:3px}
  @media (prefers-reduced-motion: reduce){ .cta{transition:none} }

  .tag{position:fixed;left:12px;bottom:12px;margin:0;z-index:10;font:600 11px/1 system-ui;letter-spacing:.04em;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff}
</style>
</head>
<body>
  <main class="demo">
    <canvas class="halftone" aria-hidden="true"></canvas>
    <section class="panel">
      <p class="panel__kicker">ISSUE #04 · HALFTONE</p>
      <h1>점 하나로<br>빛을 그리다</h1>
    </section>
    <button class="cta" type="button">다음 화 보기 →</button>
  </main>
  <p class="tag">04 · Halftone</p>

  <script>
  (() => {
    const canvas = document.querySelector('.halftone');
    const ctx = canvas.getContext('2d');
    const src = document.createElement('canvas');                    // 오프스크린 원본(저해상도)
    const sctx = src.getContext('2d', { willReadFrequently: true });
    const css = getComputedStyle(document.documentElement);
    const PAPER = css.getPropertyValue('--paper').trim();
    const INK = css.getPropertyValue('--ink').trim();
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');

    const ANGLE = Math.PI / 4;   // 망점 격자 각도
    const DOT = 0.74;            // 최대 점 반지름 = cell × DOT
    const SAMPLE = 2;            // 셀 하나당 원본 샘플 픽셀(가로·세로)
    const SPEED = 0.45;          // 빛이 공 주위를 도는 속도
    const FPS = 30;              // 하프톤은 30fps 면 충분
    const STILL = 2.7 / SPEED;   // 정지 프레임 시점(빛이 왼쪽 위)
    const TAU = Math.PI * 2;
    const t0 = performance.now();
    let w = 0, h = 0, cell = 10, raf = 0, lastDraw = 0, onScreen = true;

    /* ① 원본 장면 — 흑백. 어두울수록 큰 점이 됨 */
    function scene(g, t) {
      const m = Math.min(w, h), cx = w * .5, cy = h * .52, R = m * .24;
      let gr = g.createRadialGradient(cx, cy, R, cx, cy, Math.hypot(w, h) * .62);   // 가장자리 비네트
      gr.addColorStop(0, '#fff'); gr.addColorStop(1, '#a3a3a3');
      g.fillStyle = gr; g.fillRect(0, 0, w, h);
      g.save(); g.translate(cx, cy + R * 1.2); g.scale(1, .2);                       // 바닥 그림자
      gr = g.createRadialGradient(0, 0, 0, 0, 0, R * 1.2);
      gr.addColorStop(0, 'rgba(0,0,0,.7)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(-R * 1.2, -R * 1.2, R * 2.4, R * 2.4); g.restore();
      const tilt = -.3 + Math.sin(t * .4) * .07;
      const ring = (a0, a1) => {                                                     // 고리(반쪽씩 그림)
        g.save(); g.translate(cx, cy); g.rotate(tilt);
        g.strokeStyle = '#767676'; g.lineWidth = R * .17;
        g.beginPath(); g.ellipse(0, 0, R * 1.6, R * .4, 0, a0, a1); g.stroke();
        g.strokeStyle = '#b9b9b9'; g.lineWidth = R * .05;
        g.beginPath(); g.ellipse(0, 0, R * 1.32, R * .31, 0, a0, a1); g.stroke();
        g.restore();
      };
      ring(Math.PI, TAU);                                                            // 뒤쪽 반(공 뒤)
      const a = t * SPEED, lx = cx + Math.cos(a) * R * .5, ly = cy - R * .28 + Math.sin(a) * R * .2;
      gr = g.createRadialGradient(lx, ly, R * .04, cx, cy, R);                       // 빛이 도는 구
      gr.addColorStop(0, '#fff'); gr.addColorStop(.28, '#dcdcdc'); gr.addColorStop(.74, '#454545'); gr.addColorStop(1, '#0b0b0b');
      g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.fill();
      ring(0, Math.PI);                                                              // 앞쪽 반(공 앞)
    }

    /* ② 밝기 샘플 → 45° 격자에 점 찍기 (path 하나로 모아 fill 1회) */
    function render(t) {
      if (!w || !h) return;
      sctx.setTransform(SAMPLE / cell, 0, 0, SAMPLE / cell, 0, 0);
      scene(sctx, t);
      const sw = src.width, sh = src.height, k = SAMPLE / cell;
      const px = sctx.getImageData(0, 0, sw, sh).data;
      const cos = Math.cos(ANGLE), sin = Math.sin(ANGLE), rMax = cell * DOT;
      const n = Math.ceil(Math.hypot(w, h) / 2 / cell) + 1, ox = w / 2, oy = h / 2;
      ctx.fillStyle = PAPER; ctx.fillRect(0, 0, w, h);
      ctx.beginPath();
      for (let i = -n; i <= n; i++) for (let j = -n; j <= n; j++) {
        const x = ox + (i * cos - j * sin) * cell, y = oy + (i * sin + j * cos) * cell;
        if (x < -rMax || y < -rMax || x > w + rMax || y > h + rMax) continue;
        const sx = Math.min(sw - 1, Math.max(0, x * k | 0)), sy = Math.min(sh - 1, Math.max(0, y * k | 0));
        const r = rMax * Math.sqrt(1 - px[(sy * sw + sx) * 4] / 255);   // 면적 ∝ 어두움
        if (r < .45) continue;
        ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU);
      }
      ctx.fillStyle = INK; ctx.fill();
    }

    const draw = now => render(reduce.matches ? STILL : STILL + (now - t0) / 1000);
    function resize() {
      const r = canvas.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
      w = r.width; h = r.height;
      cell = Math.max(6, Math.min(16, Math.min(w, h) / 42));          // 화면 크기에 비례하는 망점 간격
      canvas.width = Math.max(1, Math.round(w * dpr)); canvas.height = Math.max(1, Math.round(h * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      src.width = Math.max(1, Math.ceil(w / cell * SAMPLE)); src.height = Math.max(1, Math.ceil(h / cell * SAMPLE));
      draw(performance.now());                                          // 정지 상태에서도 즉시 다시 그림
    }
    function loop(now) {
      raf = requestAnimationFrame(loop);
      if (now - lastDraw < 1000 / FPS - 1) return;
      lastDraw = now; draw(now);
    }
    const start = () => { if (!raf && onScreen && !document.hidden && !reduce.matches) raf = requestAnimationFrame(loop); };
    const stop = () => { cancelAnimationFrame(raf); raf = 0; };
    new ResizeObserver(resize).observe(canvas);
    new IntersectionObserver(([en]) => { onScreen = en.isIntersecting; onScreen ? start() : stop(); }).observe(canvas);
    document.addEventListener('visibilitychange', () => (document.hidden ? stop() : start()));
    reduce.addEventListener('change', () => { stop(); draw(performance.now()); start(); });
    start();
  })();
  </script>
</body>
</html>
