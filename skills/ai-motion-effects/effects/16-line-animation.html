<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>16 · Line Animation · 라인 애니메이션</title>
<!--
EFFECT: Line Animation (라인 애니메이션)
느낌: 펜으로 한 획씩 그려 나가는 듯한 손맛 — 차분하고 정성스러운 첫인상
잘 맞는 곳: 히어로 일러스트, 아이콘 세트 등장, 서명·로고 리빌, 헤드라인 밑줄, 카드 호버 테두리, 온보딩 단계 표시
피해야 할 곳: 면(fill) 위주의 복잡한 일러스트, path가 수백 개인 지도·차트, 계속 반복 재생되는 배경(산만함)
핵심 기법:
  - SVG stroke-dasharray / stroke-dashoffset 를 1 → 0 으로 애니메이션
  - pathLength="1" 로 실제 길이와 무관하게 CSS 값 고정 (getTotalLength() 불필요)
  - 요소별 --i × --stagger 로 animation-delay 순차 지연 (stagger)
  - IntersectionObserver 로 화면 진입 시 재생, 버튼은 클래스 토글 + reflow 로 재시작
조절 포인트:
  --draw-dur   선 하나가 그려지는 시간 (기본 1.1s)
  --stagger    다음 선까지의 지연 간격 (기본 .12s)
  --ease       그리기 이징 (기본 cubic-bezier(.65,0,.35,1))
  --ink / --accent   기본 선 색 / 강조 선 색
  --stroke     선 굵기 (viewBox 단위, 아이콘 2px · 밑줄 5px)
  --trace-dur  카드 테두리가 한 바퀴 그려지는 시간
  REPLAY_ON_SCROLL (JS)  화면을 벗어났다 돌아오면 다시 그릴지 여부
성능: 가벼움 — stroke-dashoffset 만 바뀌는 CSS 애니메이션. path 수십 개까지는 부담 없음 (수백 개면 페인트 비용 증가)
접근성: prefers-reduced-motion 이면 선을 처음부터 완성된 상태로 보여주고, 카드 테두리는 호버/포커스 시 즉시 표시.
        장식 SVG는 aria-hidden, 헤드라인은 실제 텍스트. 크림색 글자/선은 남색 배경 대비 10:1 이상.
이식 메모:
  - React: useRef 로 컨테이너를 잡고 useEffect 안에서 IntersectionObserver 생성 → cleanup 에서 disconnect().
    재생은 key 를 바꿔 리마운트하거나 클래스 토글 + el.offsetWidth reflow.
  - JSX 속성은 pathLength={1}, strokeLinecap="round" 처럼 camelCase. 지연은 style={{ '--i': 3 }}.
  - Tailwind: [stroke-dasharray:1] [stroke-dashoffset:1] + theme.extend.keyframes 에 draw 등록,
    지연은 [animation-delay:calc(var(--i)*120ms)].
  - Next.js: 관찰 로직이 있는 래퍼만 'use client'. SVG 마크업 자체는 서버 컴포넌트여도 됨.
-->
<style>
  :root{
    --bg:#0c1222;
    --ink:#f4ead5;            /* 선·글자 색 */
    --accent:#ff8a5b;         /* 강조 선 색 */
    --muted:#a3acc6;
    --stroke:2px;             /* 선 굵기 (viewBox 단위) */
    --draw-dur:1.1s;          /* 선 하나가 그려지는 시간 */
    --stagger:.12s;           /* 다음 선까지 지연 */
    --ease:cubic-bezier(.65,0,.35,1);
    --trace-dur:.9s;          /* 카드 테두리 트레이스 시간 */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(120% 90% at 50% -10%,#1c2648 0%,var(--bg) 62%) var(--bg);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    overflow:hidden;
  }
  .demo{
    min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(14px,3.4vmin,32px);padding:clamp(16px,4vmin,48px);text-align:center;
  }

  /* ───────── 핵심 1: 선이 스스로 그려지기 (pathLength="1" 기준) ───────── */
  .draw{fill:none;stroke:var(--ink);stroke-width:var(--stroke);stroke-linecap:round;stroke-linejoin:round}
  .draw .accent{stroke:var(--accent)}
  .draw > *{
    stroke-dasharray:1;       /* 대시 1 + 간격 1 → 전체 길이만큼 선, 그만큼 공백 */
    stroke-dashoffset:1;      /* 1 = 완전히 숨김, 0 = 완성 */
    opacity:0;                /* 길이 0일 때 둥근 끝점이 '점'으로 남는 현상 방지 */
  }
  .is-drawn .draw > *{
    animation:draw var(--draw-dur) var(--ease) both;
    animation-delay:calc(var(--i,0) * var(--stagger));
  }
  @keyframes draw{
    0%{stroke-dashoffset:1;opacity:0}
    2%{opacity:1}
    100%{stroke-dashoffset:0;opacity:1}
  }

  /* 아이콘 세트 */
  .icons{display:flex;gap:clamp(8px,2.2vmin,18px)}
  .icon{
    display:grid;place-items:center;width:clamp(48px,11vmin,92px);aspect-ratio:1;border-radius:28%;
    background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);
  }
  .icon svg{width:62%;height:62%;overflow:visible}

  /* 헤드라인 + 손글씨 밑줄 */
  .title{position:relative;margin:0 0 .25em;font-size:clamp(24px,6.4vmin,60px);font-weight:800;letter-spacing:-.03em;line-height:1.15}
  .underline{position:absolute;left:-4%;bottom:-.42em;width:108%;height:auto;overflow:visible;--stroke:5px}

  /* 카드 */
  .card{
    position:relative;width:min(100%,25rem);padding:clamp(16px,3.4vmin,28px);border-radius:20px;text-align:left;
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.08);
  }
  .kicker{margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--accent)}
  .card h2{margin:0 0 4px;font-size:clamp(15px,2.6vmin,20px);letter-spacing:-.01em}
  .card p.desc{margin:0 0 clamp(12px,2.4vmin,18px);font-size:clamp(12px,2vmin,15px);line-height:1.5;color:var(--muted)}

  /* ───────── 핵심 2: 호버/포커스 시 카드 테두리가 따라 그려짐 ───────── */
  .trace{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  .trace rect{
    fill:none;stroke:var(--accent);stroke-width:2;
    stroke-dasharray:1;stroke-dashoffset:1;opacity:0;
    transition:stroke-dashoffset var(--trace-dur) var(--ease),opacity .15s var(--trace-dur); /* 나갈 때: 되감은 뒤 숨김 */
  }
  .card:hover .trace rect,.card:focus-within .trace rect{
    stroke-dashoffset:0;opacity:1;
    transition:stroke-dashoffset var(--trace-dur) var(--ease),opacity .1s;
  }

  .btn{
    display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:0;border-radius:999px;
    background:var(--ink);color:#141a2e;font:inherit;font-size:clamp(12px,2vmin,14px);font-weight:700;
    cursor:pointer;transition:transform .2s ease,box-shadow .2s ease;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .btn:active{transform:scale(.98)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .btn svg{width:16px;height:16px;overflow:visible;--stroke:2.2px}
  .btn .draw{stroke:currentColor}

  @media (prefers-reduced-motion:reduce){
    .draw > *{animation:none !important;stroke-dashoffset:0;opacity:1}
    .trace rect,.card:hover .trace rect,.btn{transition:none !important}
  }

  .tag{position:fixed;left:12px;bottom:12px;z-index:10;margin:0;font:600 11px/1 system-ui;letter-spacing:.04em;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;}
</style>
</head>
<body>
  <main class="demo">
    <!-- 아이콘 세트: 각 선에 pathLength="1" + 순서(--i) -->
    <div class="icons art" aria-hidden="true">
      <span class="icon"><svg class="draw" viewBox="0 0 48 48">
        <path pathLength="1" style="--i:0" d="M4 40L17 21L25 31L31 24L44 40Z"/>
        <path pathLength="1" style="--i:1" class="accent" d="M30 12a5 5 0 1 0 10 0a5 5 0 1 0-10 0"/>
      </svg></span>
      <span class="icon"><svg class="draw" viewBox="0 0 48 48">
        <path pathLength="1" style="--i:2" d="M9 20h24v8a10 10 0 0 1-10 10h-4A10 10 0 0 1 9 28Z"/>
        <path pathLength="1" style="--i:3" d="M33 22h3a5 5 0 0 1 0 10h-3"/>
        <path pathLength="1" style="--i:4" class="accent" d="M17 6c-2 3 2 5 0 9"/>
        <path pathLength="1" style="--i:5" class="accent" d="M25 6c-2 3 2 5 0 9"/>
      </svg></span>
      <span class="icon"><svg class="draw" viewBox="0 0 48 48">
        <path pathLength="1" style="--i:6" d="M5 22L43 7L33 41L23 29Z"/>
        <path pathLength="1" style="--i:7" class="accent" d="M23 29L43 7"/>
        <path pathLength="1" style="--i:8" d="M23 29v10l6-5"/>
      </svg></span>
      <span class="icon"><svg class="draw" viewBox="0 0 48 48">
        <path pathLength="1" style="--i:9" d="M22 7C23.5 17 27 20.5 37 22C27 23.5 23.5 27 22 37C20.5 27 17 23.5 7 22C17 20.5 20.5 17 22 7Z"/>
        <path pathLength="1" style="--i:10" class="accent" d="M38 5c.6 3 1.9 4.4 5 5c-3.1.6-4.4 2-5 5c-.6-3-1.9-4.4-5-5c3.1-.6 4.4-2 5-5Z"/>
      </svg></span>
    </div>

    <h1 class="title">선이 그리는 첫인상
      <svg class="underline draw" viewBox="0 0 320 24" aria-hidden="true">
        <path pathLength="1" style="--i:11;--draw-dur:.9s" class="accent" d="M6 16C70 6 150 4 214 10S296 20 314 8"/>
      </svg>
    </h1>

    <article class="card">
      <svg class="trace" aria-hidden="true"><rect x="0" y="0" width="100%" height="100%" rx="19" ry="19" pathLength="1"/></svg>
      <p class="kicker">HOVER · FOCUS</p>
      <h2>테두리가 따라 그려져요</h2>
      <p class="desc">마우스를 올리거나 버튼에 포커스하면 선이 한 바퀴 돌아요.</p>
      <button class="btn" type="button" id="replay">
        <svg class="draw" viewBox="0 0 24 24" aria-hidden="true">
          <path pathLength="1" style="--i:12" d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4"/>
        </svg>
        다시 그리기
      </button>
    </article>
  </main>
  <p class="tag">16 · Line Animation</p>
  <script>
    // ── 재생 제어: 클래스를 뗐다 붙여 CSS 애니메이션을 처음부터 다시 실행 ──
    const REPLAY_ON_SCROLL = true;           // 화면 재진입 시마다 다시 그리기
    const demo = document.querySelector('.demo');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');

    function play() {
      demo.classList.remove('is-drawn');
      void demo.offsetWidth;                 // 강제 reflow → 애니메이션 리셋
      demo.classList.add('is-drawn');
    }

    document.getElementById('replay').addEventListener('click', play);

    if (reduce.matches || !('IntersectionObserver' in window)) {
      demo.classList.add('is-drawn');        // 모션 감소: CSS가 완성 상태로 표시
    } else {
      const io = new IntersectionObserver((entries) => {
        for (const e of entries) {
          if (e.isIntersecting) {
            play();
            if (!REPLAY_ON_SCROLL) io.disconnect();
          } else {
            demo.classList.remove('is-drawn'); // 화면 밖에서 리셋 → 돌아오면 다시 그림
          }
        }
      }, { threshold: 0.35 });
      io.observe(document.querySelector('.art'));
    }
  </script>
</body>
</html>
