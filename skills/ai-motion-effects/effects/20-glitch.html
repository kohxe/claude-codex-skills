<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>20 · Glitch · 글리치</title>
<!--
EFFECT: Glitch (글리치)
느낌: 신호가 순간적으로 끊기는 디지털 오류 — 사이버펑크·테크한 긴장감, 평소엔 고요하다가 짧게 튀는 리듬
잘 맞는 곳: 게임·음악·테크 브랜드 히어로 헤드라인, 404/에러/점검 페이지, 이벤트 티저, 호버 시 CTA 버튼
피해야 할 곳: 긴 본문·작은 글씨, 금융·의료 등 신뢰가 중요한 화면, 화면 전체에 깔리는 배경(피로·광과민 위험)
핵심 기법:
  - ::before / ::after 에 content: attr(data-text) 로 텍스트 복제 → 빨강/청록, mix-blend-mode: screen
  - clip-path: inset() 가로 슬라이스가 steps(1) 키프레임으로 뚝뚝 점프 + 같은 타이밍의 가로 흔들림(shake)
  - 긴 주기(--cycle) 대부분은 정지, 두 번의 짧은 버스트만 → 지치지 않는 간헐적 글리치
  - content: attr(data-text) / "" (대체 텍스트 비움)로 복제 텍스트를 스크린리더에서 숨김, 스캔라인은 고정 오버레이
조절 포인트:
  --cycle    글리치 주기 (기본 6s, 이 안에 버스트 2회: 약 0.15s + 0.45s)
  --shift    RGB 분리·흔들림 최대 거리 (기본 .06em, 글자 크기에 비례)
  --red / --cyan   분리 채널 색
  --scan     스캔라인 밝기
  키프레임 30~32.5%, 86.5~94% 구간 = 버스트 위치·길이 (구간을 줄이면 더 차분해짐)
성능: 가벼움 — CSS만 사용, transform/opacity/clip-path 변경. 큰 헤드라인 한두 개 정도면 부담 없음
접근성: prefers-reduced-motion 이면 모든 글리치·흔들림·스캔 롤을 멈추고 '얼어붙은' 정지 프레임(옅은 RGB 분리)만 표시.
        버스트는 6초에 2회(초당 3회 플래시 기준보다 훨씬 낮음), 글자 띠 일부만 변하고 화면 전체 번쩍임 없음.
        실제 텍스트는 그대로 남고 복제본은 장식(대체 텍스트 "")이라 스크린리더가 한 번만 읽음.
이식 메모:
  - React: data-text={label} 로 같은 문자열을 넘기는 <GlitchText> 컴포넌트로 감싸기. JS 불필요
  - Tailwind: before:content-[attr(data-text)] after:content-[attr(data-text)] before:mix-blend-screen + 키프레임은
    theme.extend.keyframes / animation 에 등록 (steps(1,end) 포함)
  - Next.js: 서버 컴포넌트 가능 (CSS만 사용). CSS Modules 라면 키프레임 이름이 해시되니 같은 파일 안에 정의
  - 복제 텍스트가 줄바꿈되면 슬라이스가 어긋나니 white-space: nowrap 유지하거나 줄마다 따로 적용
-->
<style>
  :root{
    --bg:#07080d;
    --text:#f2f5ff;
    --muted:#9aa3b8;
    --red:#ff2a6d;
    --cyan:#05d9e8;
    --cycle:6s;          /* 글리치 주기 */
    --shift:.06em;       /* RGB 분리 최대 거리 */
    --scan:rgba(255,255,255,.035);
    --mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(60% 50% at 50% 45%,#07171c,var(--bg) 70%) var(--bg);
    color:var(--text);overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .demo{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(12px,2.6vmin,24px);padding:clamp(16px,4vmin,48px);text-align:center}
  .status{margin:0;display:inline-flex;align-items:center;gap:8px;font:500 clamp(10px,1.7vmin,13px)/1 var(--mono);
    letter-spacing:.08em;color:var(--muted)}
  .status i{width:7px;height:7px;border-radius:50%;background:var(--red)}
  .sub{margin:0;max-width:32ch;font-size:clamp(13px,2.2vmin,17px);line-height:1.55;color:var(--muted)}

  /* ───────── 핵심 1: 글리치 헤드라인 ───────── */
  .glitch{
    position:relative;display:inline-block;margin:0;white-space:nowrap;
    font-size:clamp(30px,11vmin,136px);font-weight:900;line-height:1;letter-spacing:.02em;color:var(--text);
    /* 평소: 아주 옅은 색수차만 (정적) */
    text-shadow:calc(var(--shift) * -.35) 0 rgba(255,42,109,.45),calc(var(--shift) * .35) 0 rgba(5,217,232,.45);
    animation-name:shake;
  }
  .glitch,.glitch::before,.glitch::after{
    animation-duration:var(--cycle);animation-timing-function:steps(1,end);animation-iteration-count:infinite;
  }
  .glitch::before,.glitch::after{
    content:attr(data-text);
    content:attr(data-text) / "";      /* 대체 텍스트 "" → 스크린리더 중복 낭독 방지 (미지원 브라우저는 윗줄 사용) */
    position:absolute;inset:0;pointer-events:none;
    mix-blend-mode:screen;text-shadow:none;opacity:0;
  }
  .glitch::before{color:var(--red);animation-name:slice-a}
  .glitch::after{color:var(--cyan);animation-name:slice-b}

  /* 버스트 ①30~32.5%(짧게) ②86.5~94%(길게) — 나머지는 정지 */
  @keyframes slice-a{
    0%,30%,32.5%,94%,100%{opacity:0;transform:none;clip-path:inset(50% 0 50% 0)}
    30.5%{opacity:1;transform:translateX(calc(var(--shift) * -1));clip-path:inset(18% 0 60% 0)}
    31.5%{opacity:1;transform:translateX(calc(var(--shift) * .7));clip-path:inset(62% 0 16% 0)}
    86.5%{opacity:1;transform:translateX(calc(var(--shift) * -1));clip-path:inset(6% 0 78% 0)}
    88%  {opacity:1;transform:translateX(calc(var(--shift) * .8));clip-path:inset(44% 0 34% 0)}
    89.5%{opacity:1;transform:translateX(calc(var(--shift) * -.5));clip-path:inset(72% 0 8% 0)}
    91%  {opacity:1;transform:translateX(calc(var(--shift) * 1.2));clip-path:inset(24% 0 58% 0)}
    92.5%{opacity:1;transform:translateX(calc(var(--shift) * -.8));clip-path:inset(0 0 86% 0)}
  }
  @keyframes slice-b{
    0%,30%,32.5%,94%,100%{opacity:0;transform:none;clip-path:inset(50% 0 50% 0)}
    30.5%{opacity:1;transform:translateX(calc(var(--shift) * .9));clip-path:inset(58% 0 22% 0)}
    31.5%{opacity:1;transform:translateX(calc(var(--shift) * -.6));clip-path:inset(10% 0 74% 0)}
    86.5%{opacity:1;transform:translateX(var(--shift));clip-path:inset(64% 0 14% 0)}
    88%  {opacity:1;transform:translateX(calc(var(--shift) * -1.1));clip-path:inset(12% 0 70% 0)}
    89.5%{opacity:1;transform:translateX(calc(var(--shift) * .6));clip-path:inset(36% 0 46% 0)}
    91%  {opacity:1;transform:translateX(calc(var(--shift) * -.9));clip-path:inset(80% 0 2% 0)}
    92.5%{opacity:1;transform:translateX(calc(var(--shift) * .5));clip-path:inset(50% 0 30% 0)}
  }
  @keyframes shake{ /* 같은 구간에 본문 글자도 살짝 가로로 튐 */
    0%,30%,32.5%,89.5%,94%,100%{transform:none}
    30.5%{transform:translateX(calc(var(--shift) * .4))}
    31.5%{transform:translateX(calc(var(--shift) * -.3))}
    86.5%{transform:translateX(calc(var(--shift) * -.5)) skewX(-8deg)}
    88%  {transform:translateX(calc(var(--shift) * .4))}
    91%  {transform:translateX(calc(var(--shift) * .5)) skewX(6deg)}
    92.5%{transform:translateX(calc(var(--shift) * -.2))}
  }

  /* ───────── 핵심 2: 호버/포커스 시 한 번 글리치하는 버튼 ───────── */
  .btn{
    position:relative;padding:12px 22px;border:1px solid rgba(5,217,232,.55);border-radius:6px;
    background:#0a1419;color:#e9fdff;cursor:pointer;
    font:600 clamp(13px,2.1vmin,15px)/1.2 var(--mono);letter-spacing:.06em;
    transition:background-color .2s,border-color .2s;
  }
  .btn::before,.btn::after{
    content:attr(data-text);content:attr(data-text) / "";
    position:absolute;inset:0;padding:inherit;mix-blend-mode:screen;opacity:0;pointer-events:none;
  }
  .btn::before{color:var(--red)}
  .btn::after{color:var(--cyan)}
  .btn:hover,.btn:focus-visible{background:rgba(5,217,232,.14);border-color:var(--cyan)}
  .btn:hover::before,.btn:focus-visible::before{animation:btn-a .42s steps(1,end) both}
  .btn:hover::after,.btn:focus-visible::after{animation:btn-b .42s steps(1,end) both}
  .btn:focus-visible{outline:2px solid var(--text);outline-offset:3px}
  @keyframes btn-a{
    0%  {opacity:1;transform:translateX(-3px);clip-path:inset(0 0 55% 0)}
    25% {opacity:1;transform:translateX(3px);clip-path:inset(60% 0 0 0)}
    50% {opacity:1;transform:translateX(-2px);clip-path:inset(25% 0 40% 0)}
    75% {opacity:1;transform:translateX(2px);clip-path:inset(5% 0 70% 0)}
    100%{opacity:0;transform:none;clip-path:inset(50% 0 50% 0)}
  }
  @keyframes btn-b{
    0%  {opacity:1;transform:translateX(3px);clip-path:inset(50% 0 10% 0)}
    25% {opacity:1;transform:translateX(-3px);clip-path:inset(0 0 65% 0)}
    50% {opacity:1;transform:translateX(2px);clip-path:inset(65% 0 5% 0)}
    75% {opacity:1;transform:translateX(-2px);clip-path:inset(35% 0 30% 0)}
    100%{opacity:0;transform:none;clip-path:inset(50% 0 50% 0)}
  }

  /* 스캔라인 + 비네트 + 천천히 내려가는 밝은 띠 */
  .scanlines{
    position:fixed;inset:0;z-index:5;pointer-events:none;
    background:repeating-linear-gradient(to bottom,var(--scan) 0 1px,transparent 1px 3px),
               radial-gradient(120% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%);
  }
  .scanlines::after{
    content:"";position:absolute;left:0;right:0;top:0;height:24%;
    background:linear-gradient(to bottom,transparent,rgba(5,217,232,.045),transparent);
    animation:roll 7s linear infinite;
  }
  @keyframes roll{from{transform:translateY(-100%)}to{transform:translateY(420%)}}

  @media (prefers-reduced-motion:reduce){
    .glitch,.glitch::before,.glitch::after,.btn::before,.btn::after,.scanlines::after{animation:none !important}
    /* 정지 프레임: 한 조각만 어긋난 채 얼어붙은 모습 */
    .glitch::before{opacity:.85;clip-path:inset(62% 0 16% 0);transform:translateX(calc(var(--shift) * -.6))}
    .btn{transition:none}
  }

  .tag{position:fixed;left:12px;bottom:12px;z-index:10;margin:0;font:600 11px/1 system-ui;letter-spacing:.04em;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;}
</style>
</head>
<body>
  <main class="demo">
    <p class="status"><i aria-hidden="true"></i>ERR_0x1F · 신호 불안정</p>
    <h1 class="glitch" data-text="SIGNAL LOST">SIGNAL LOST</h1>
    <p class="sub">연결이 잠시 끊겼어요. 곧 다시 돌아올게요.</p>
    <button class="btn" type="button" data-text="다시 연결하기">다시 연결하기</button>
    <div class="scanlines" aria-hidden="true"></div>
  </main>
  <p class="tag">20 · Glitch</p>
</body>
</html>
