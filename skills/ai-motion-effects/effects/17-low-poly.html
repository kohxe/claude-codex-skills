<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>17 · Low Poly · 로우 폴리</title>
<!--
EFFECT: Low Poly (로우 폴리)
느낌: 크리스탈을 깎아 놓은 듯한 각진 면들이 빛을 받아 은은하게 반짝이는, 기하학적이고 차가운 고급감
잘 맞는 곳: 히어로 배경, 랜딩 첫 화면, 게임·테크·아웃도어 브랜드 섹션 배경, 이벤트 배너
피해야 할 곳: 긴 본문 바로 뒤(면 경계가 글자와 경쟁), 데이터 표·대시보드, 작은 카드 안 배경(면이 너무 커 보임)
핵심 기법:
  - Canvas 2D: 흔들린(jittered) 격자점 → 셀마다 삼각형 2개, 대각선 방향을 체커보드로 교차
  - 삼각형 무게중심(centroid)에서 그라디언트 팔레트를 샘플링해 면 색 결정
  - 꼭짓점에 가짜 높이(z)를 줘 외적(cross product)으로 법선을 구하고, 포인터를 따라오는 조명과 램버트(Lambert) 셰이딩
  - 꼭짓점이 sin/cos 오프셋으로 천천히 떠다녀 면이 일렁임 + 같은 색 1px 스트로크로 삼각형 사이 틈(seam) 제거
조절 포인트 (JS 상수):
  CELL / MIN_CELL   셀 크기 (화면 짧은 변 비율 / 최소 px) — 작을수록 잘게 쪼개짐
  JITTER            격자점 무작위 흔들림 (0~0.5)
  DRIFT / SPEED     꼭짓점이 떠다니는 폭(셀 대비) / 속도
  RELIEF            가짜 높이 → 면 기울기 → 명암 대비
  AMBIENT / DIFFUSE / SHINE   주변광 / 난반사 / 조명 근처 하이라이트 세기
  LIGHT_Z / FOLLOW  조명 높이 / 포인터를 따라가는 부드러움
  PALETTE           왼쪽 위 → 오른쪽 아래 그라디언트 색
  CSS: --panel-bg, --blur (프로스티드 패널 투명도·블러)
성능: 보통 — 1080p 기준 삼각형 약 300개를 매 프레임 다시 칠함(CELL 을 줄이면 제곱으로 증가). 화면 밖·탭 숨김 시 정지, DPR 2 상한
접근성: prefers-reduced-motion 이면 루프 없이 정지 프레임 1장만 그림(포인터 조명은 즉시 반영, 보간 없음).
        글자는 반투명 어두운 프로스티드 패널 위에 올려 배경 밝기와 무관하게 대비 확보.
이식 메모:
  - React: canvasRef + useEffect 에서 init → cleanup 에서 cancelAnimationFrame, ResizeObserver/IntersectionObserver disconnect, 이벤트 해제
  - Next.js: 'use client' 컴포넌트. window·matchMedia 는 useEffect 안에서만 접근
  - Tailwind: 패널은 backdrop-blur-lg bg-[rgba(7,20,42,.4)] border-white/20 로 대체, 캔버스는 fixed inset-0 -z-10
  - 정적인 결과만 필요하면 한 프레임을 그려 toDataURL() 로 이미지화하거나 SVG polygon 으로 미리 생성
-->
<style>
  :root{
    --bg:#0b1e3f;
    --panel-bg:rgba(7,20,42,.40);   /* 프로스티드 패널 색·투명도 */
    --panel-line:rgba(255,255,255,.22);
    --blur:16px;                     /* 패널 뒤 블러 */
    --text:#f2fbff;
    --muted:#cfe6ee;
    --cta:#bff3dc;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--text);overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  /* 캔버스 = 전체 배경 */
  .mesh{position:fixed;inset:0;width:100%;height:100%;display:block}
  .demo{min-height:100%;display:grid;place-items:center;padding:clamp(16px,5vmin,56px)}

  /* 대비용 프로스티드 패널 */
  .panel{
    position:relative;width:min(100%,32rem);text-align:center;
    padding:clamp(18px,4.6vmin,44px);border-radius:clamp(18px,3vmin,28px);
    background:var(--panel-bg);border:1px solid var(--panel-line);
    box-shadow:0 24px 60px rgba(3,10,28,.35),inset 0 1px 0 rgba(255,255,255,.22);
    -webkit-backdrop-filter:blur(var(--blur)) saturate(150%);backdrop-filter:blur(var(--blur)) saturate(150%);
  }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .panel{background:rgba(7,20,42,.8)}
  }
  .eyebrow{margin:0 0 clamp(6px,1.4vmin,12px);font-size:clamp(11px,1.6vmin,12px);font-weight:700;letter-spacing:.18em;color:var(--cta)}
  h1{margin:0;font-size:clamp(24px,6.6vmin,60px);line-height:1.12;letter-spacing:-.03em;font-weight:800}
  .lede{margin:clamp(8px,1.8vmin,16px) auto clamp(14px,3vmin,26px);max-width:30ch;font-size:clamp(12px,2.1vmin,17px);line-height:1.55;color:var(--muted)}
  .btn{
    display:inline-flex;align-items:center;gap:8px;padding:clamp(9px,1.6vmin,13px) clamp(16px,2.6vmin,24px);
    border:0;border-radius:999px;background:var(--cta);color:#06243a;
    font:inherit;font-size:clamp(12px,1.9vmin,15px);font-weight:700;cursor:pointer;
    box-shadow:0 6px 18px rgba(3,10,28,.28);transition:transform .2s ease,box-shadow .2s ease;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(3,10,28,.36)}
  .btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){ .btn{transition:none} }

  .tag{position:fixed;left:12px;bottom:12px;z-index:10;margin:0;font:600 11px/1 system-ui;letter-spacing:.04em;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;}
</style>
</head>
<body>
  <main class="demo">
    <canvas class="mesh" aria-hidden="true"></canvas>
    <section class="panel">
      <p class="eyebrow">LOW POLY · GLACIER</p>
      <h1>빛을 깎아 만든 면</h1>
      <p class="lede">포인터를 움직이면 조명이 따라오며 면마다 다른 빛을 받아요.</p>
      <button class="btn" type="button">컬렉션 보기 <span aria-hidden="true">→</span></button>
    </section>
  </main>
  <p class="tag">17 · Low Poly</p>
  <script>
  (() => {
    // ───────── 조절 포인트 ─────────
    const CELL = 0.14, MIN_CELL = 40;   // 셀 크기: 화면 짧은 변 × CELL (최소 px)
    const JITTER = 0.36;                // 격자점 흔들림 (0 ~ 0.5)
    const DRIFT = 0.12, SPEED = 0.00042;// 꼭짓점 떠다니는 폭(셀 대비) / 속도
    const RELIEF = 0.9;                 // 가짜 높이 → 면 기울기(명암 대비)
    const AMBIENT = 0.42, DIFFUSE = 0.78, SHINE = 0.45; // 주변광 / 난반사 / 하이라이트
    const LIGHT_Z = 0.45;               // 조명 높이 (짧은 변 대비)
    const FOLLOW = 0.07;                // 조명이 포인터를 따라가는 비율 (60fps 기준)
    const PALETTE = ['#0b1e3f', '#17497a', '#1f7fa6', '#3fb8b0', '#a8e6cf']; // ↖ → ↘

    const canvas = document.querySelector('.mesh');
    const ctx = canvas.getContext('2d');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    const stops = PALETTE.map(h => [1, 3, 5].map(k => parseInt(h.slice(k, k + 2), 16)));

    let W = 0, H = 0, S = 1, dpr = 1, cell = 60, cols = 0, rows = 0, pts = [];
    const light = { x: 0, y: 0 }, target = { x: 0, y: 0 };
    let pointer = false, raf = 0, last = 0, onScreen = true, pending = false;

    // 팔레트 선형 보간 (t: 0~1)
    function sample(t) {
      t = Math.min(1, Math.max(0, t)) * (stops.length - 1);
      const i = Math.min(stops.length - 2, Math.floor(t)), f = t - i, a = stops[i], b = stops[i + 1];
      return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
    }

    // 고정 시드 난수: 리사이즈해도 같은 칸은 같은 모양 유지
    const rnd = (i, j, k) => { const v = Math.sin(i * 127.1 + j * 311.7 + k * 74.7) * 43758.5453; return v - Math.floor(v); };

    // 화면보다 한 칸씩 넓은 흔들린 격자 (가장자리 빈틈 방지)
    function build() {
      cell = Math.max(MIN_CELL, S * CELL);
      cols = Math.ceil(W / cell) + 2; rows = Math.ceil(H / cell) + 2;
      pts = [];
      for (let j = 0; j <= rows; j++) for (let i = 0; i <= cols; i++) pts.push({
        bx: (i - 1 + (rnd(i, j, 1) - 0.5) * 2 * JITTER) * cell,
        by: (j - 1 + (rnd(i, j, 2) - 0.5) * 2 * JITTER) * cell,
        z: rnd(i, j, 3), a: rnd(i, j, 4) * 6.283, b: rnd(i, j, 5) * 6.283, x: 0, y: 0, h: 0
      });
    }

    // 삼각형 하나: 무게중심 색 + 가짜 법선 · 조명 셰이딩
    function tri(p, q, r) {
      const cx = (p.x + q.x + r.x) / 3, cy = (p.y + q.y + r.y) / 3, hz = cell * RELIEF;
      const ux = q.x - p.x, uy = q.y - p.y, uz = (q.h - p.h) * hz;
      const vx = r.x - p.x, vy = r.y - p.y, vz = (r.h - p.h) * hz;
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      if (nz < 0) { nx = -nx; ny = -ny; nz = -nz; }           // 항상 화면 쪽을 향하게
      const lx = light.x - cx, ly = light.y - cy, lz = S * LIGHT_Z;
      const lambert = Math.max(0, (nx * lx + ny * ly + nz * lz) / ((Math.hypot(nx, ny, nz) || 1) * Math.hypot(lx, ly, lz)));
      const glow = Math.exp(-(lx * lx + ly * ly) / (S * S * 0.18)); // 조명 근처 하이라이트
      const base = sample((cx / W) * 0.55 + (cy / H) * 0.45);
      const k = AMBIENT + DIFFUSE * lambert, add = 255 * SHINE * glow * lambert;
      ctx.fillStyle = ctx.strokeStyle =
        `rgb(${Math.min(255, base[0] * k + add) | 0},${Math.min(255, base[1] * k + add) | 0},${Math.min(255, base[2] * k + add) | 0})`;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.lineTo(r.x, r.y); ctx.closePath();
      ctx.fill(); ctx.stroke();                                 // 같은 색 스트로크 → 머리카락 틈 제거
    }

    function frame(t, ease) {
      const amp = cell * DRIFT;
      for (const p of pts) {                                    // 꼭짓점 드리프트 + 높이 일렁임
        p.x = p.bx + Math.sin(t * SPEED + p.a) * amp;
        p.y = p.by + Math.cos(t * SPEED * 0.8 + p.b) * amp;
        p.h = p.z + Math.sin(t * SPEED * 1.7 + p.a) * 0.35;
      }
      if (!pointer) {                                           // 포인터가 없으면 조명이 천천히 순회
        target.x = W * (0.5 + 0.32 * Math.sin(t * 0.00023 - 1));
        target.y = H * (0.42 - 0.25 * Math.cos(t * 0.00031 + 0.6));
      }
      light.x += (target.x - light.x) * ease;
      light.y += (target.y - light.y) * ease;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineWidth = 1; ctx.lineJoin = 'round';
      const n = cols + 1;
      for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
        const a = pts[j * n + i], b = pts[j * n + i + 1], c = pts[(j + 1) * n + i], d = pts[(j + 1) * n + i + 1];
        if ((i + j) & 1) { tri(a, b, d); tri(a, d, c); }        // 대각선 방향을 셀마다 교차
        else { tri(a, b, c); tri(b, d, c); }
      }
    }

    // ───────── 루프 · 일시정지 ─────────
    function loop(t) {
      const dt = Math.min(50, t - (last || t)); last = t;
      frame(t, 1 - Math.pow(1 - FOLLOW, dt / 16.7));           // 주사율과 무관한 보간
      raf = requestAnimationFrame(loop);
    }
    function start() {
      if (!raf && onScreen && !document.hidden && !reduce.matches) { last = 0; raf = requestAnimationFrame(loop); }
    }
    function stop() { cancelAnimationFrame(raf); raf = 0; }

    function resize() {
      const r = canvas.getBoundingClientRect();
      W = r.width; H = r.height; S = Math.min(W, H) || 1;
      dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      build();
      if (!light.x && !light.y) { light.x = W * 0.23; light.y = H * 0.21; }
      frame(raf ? last : 0, raf ? 0 : 1);                       // 리사이즈로 지워진 캔버스 즉시 다시 칠함
    }

    addEventListener('pointermove', (e) => {
      pointer = true; target.x = e.clientX; target.y = e.clientY;
      if (!raf && !pending) {                                   // 루프가 없으면 정지 프레임만 갱신
        pending = true;
        requestAnimationFrame(() => { pending = false; frame(0, 1); });
      }
    });
    addEventListener('pointerout', (e) => { if (!e.relatedTarget) pointer = false; });

    new ResizeObserver(resize).observe(canvas);
    new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; onScreen ? start() : stop(); }).observe(canvas);
    document.addEventListener('visibilitychange', () => (document.hidden ? stop() : start()));
    reduce.addEventListener('change', () => { stop(); start(); if (!raf) frame(0, 1); });
  })();
  </script>
</body>
</html>
