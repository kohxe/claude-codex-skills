<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>15 · Memphis Design · 멤피스 디자인</title>
<!--
EFFECT: Memphis Design (멤피스 디자인)
느낌: 꼬불선·지그재그·도트·색종이 삼각형이 둥둥 떠다니는, 80년대 멤피스 그룹식 유쾌한 반항
잘 맞는 곳: 이벤트·프로모션 랜딩, 키즈·엔터테인먼트·F&B 브랜드, 히어로 배경, 404/빈 상태 화면, SNS 카드
피해야 할 곳: 긴 본문 위, 신뢰가 중요한 금융·의료·B2B 대시보드, 이미 복잡한 화면(시각 소음 과다)
핵심 기법:
  - 장식 도형: SVG <use>로 같은 path를 두 번 그려(굵은 검정 + 얇은 색) '검정 외곽선' 표현, 나머지는 CSS(border-radius·gradient)
  - 떠다니기: transform 키프레임(bob = 오르내림+흔들기, spin = 천천히 회전), 도형마다 --t 주기를 달리해 엇박
  - 패럴랙스: 포인터 위치(-1..1)를 lerp해 --mx/--my에 넣고, 개별 속성 translate × 도형별 깊이 --d
  - 카드: 하드 섀도 2겹(색 그림자 + 검정 외곽) + 사선 스트라이프 띠
조절 포인트:
  - --pink / --yellow / --teal / --blue / --lilac / --orange / --cream: 팔레트
  - --line: 외곽선 두께 / --parallax: 패럴랙스 최대 이동량
  - 도형별 --x --y(위치) --w(크기) --d(깊이: 클수록 많이 움직임) --t(주기) --r(기본 각도)
  - FOLLOW (JS): 포인터를 따라붙는 비율 — 작을수록 느긋하게
성능: 가벼움 — 도형 15개의 transform/translate 애니메이션. 패럴랙스 rAF는 포인터가 움직일 때만 돌고
      목표에 도달하면(또는 탭이 숨으면) 스스로 멈춤
접근성: prefers-reduced-motion이면 떠다니기·패럴랙스를 끄고 도형을 기본 각도로 고정한 정적 구성만 표시.
        장식 레이어는 aria-hidden + pointer-events:none. 카드 텍스트는 검정 on 흰색(≈18:1),
        파란 강조 글자는 도형용보다 진한 #1e66d8(≈5.3:1)
이식 메모:
  - React: 장식 도형을 배열 데이터로 map, 패럴랙스는 useEffect에서 pointermove 등록 → cleanup에서 removeEventListener·cancelAnimationFrame
  - --mx/--my는 state가 아니라 document.documentElement.style.setProperty로 직접 갱신(리렌더 방지)
  - Tailwind: [translate:calc(var(--mx)*var(--d)*4vmin)_calc(var(--my)*var(--d)*4vmin)], shadow-[8px_8px_0_#b49bff]
  - Next.js: 장식 레이어는 서버 컴포넌트, 패럴랙스 훅만 'use client'
-->
<style>
  :root{
    --cream:#fff3df; --ink:#141414;
    --pink:#ff8fb8; --yellow:#ffd23f; --teal:#2ec4b6; --blue:#3a86ff; --lilac:#b49bff; --orange:#ff7a45;
    --line:3px; --parallax:4vmin;
    --mx:0; --my:0;                                   /* JS가 -1..1로 갱신 */
    --sans:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  html,body{margin:0;height:100%}
  body{display:grid;place-items:center;overflow:hidden;background:var(--cream);color:var(--ink);font-family:var(--sans)}

  /* ── 장식 레이어: 떠다니는 도형 ── */
  .scene{position:fixed;inset:0;overflow:hidden;pointer-events:none}
  .s{position:absolute;left:var(--x);top:var(--y);width:var(--w);height:auto;box-sizing:border-box;
    translate:calc(var(--mx) * var(--d,.5) * var(--parallax)) calc(var(--my) * var(--d,.5) * var(--parallax));
    transform:rotate(var(--r,0deg));
    animation:bob var(--t,8s) ease-in-out infinite alternate}
  .s.spin{animation:spin var(--t,24s) linear infinite var(--dir,normal)}
  @keyframes bob{
    from{transform:translateY(-1.4vmin) rotate(calc(var(--r,0deg) - 9deg))}
    to  {transform:translateY(1.4vmin)  rotate(calc(var(--r,0deg) + 9deg))}
  }
  @keyframes spin{to{transform:rotate(calc(var(--r,0deg) + 360deg))}}

  /* SVG 선 도형: 같은 path를 굵은 검정(.o) 위에 얇은 색(.f)으로 → 검정 외곽선 */
  .o,.f{fill:none;stroke-linecap:round;stroke-linejoin:round}
  .o{stroke:var(--ink);stroke-width:13}
  .f{stroke:var(--f);stroke-width:6}
  .tri{fill:var(--f);stroke:var(--ink);stroke-width:4;stroke-linejoin:round}
  /* CSS 도형 */
  .dots{aspect-ratio:1;background:radial-gradient(circle,var(--ink) 0 24%,transparent 27%) 0 0/20% 20%}
  .half{aspect-ratio:2;background:var(--teal);border:var(--line) solid var(--ink);border-radius:50% 50% 0 0/100% 100% 0 0}
  .ring{aspect-ratio:1;border-radius:50%;background:var(--yellow);border:var(--line) solid var(--ink)}
  .ring::after{content:"";position:absolute;inset:26%;border-radius:50%;background:var(--cream);border:var(--line) solid var(--ink)}
  .stripes{aspect-ratio:1.3;border:var(--line) solid var(--ink);background:repeating-linear-gradient(45deg,var(--ink) 0 3px,var(--lilac) 3px 11px)}
  .ball{aspect-ratio:1;border-radius:50%;background:var(--f);border:var(--line) solid var(--ink)}

  /* ── 헤드라인 카드 ── */
  .demo{position:relative;z-index:1}
  .card{--pad:clamp(16px,4.6vmin,34px);--sh:clamp(7px,1.8vmin,12px);
    box-sizing:border-box;width:min(80vw,430px);padding:var(--pad);overflow:hidden;text-align:center;
    background:#fff;border:var(--line) solid var(--ink);border-radius:clamp(12px,2.4vmin,20px);
    box-shadow:var(--sh) var(--sh) 0 var(--lilac),var(--sh) var(--sh) 0 var(--line) var(--ink);  /* 색 그림자 + 검정 외곽 */
    rotate:-1.5deg;translate:calc(var(--mx) * -1vmin) calc(var(--my) * -1vmin)}
  .band{height:clamp(12px,3vmin,18px);margin:calc(var(--pad) * -1) calc(var(--pad) * -1) clamp(12px,3vmin,20px);
    border-bottom:var(--line) solid var(--ink);background:repeating-linear-gradient(-45deg,var(--pink) 0 8px,var(--yellow) 8px 16px)}
  .kicker{margin:0 0 .7em;font:800 clamp(10px,2.3vmin,12px)/1 var(--sans);letter-spacing:.2em}
  h1{margin:0;font:900 clamp(26px,7.6vmin,58px)/1.04 var(--sans);letter-spacing:-.035em}
  .hl{color:#1e66d8;text-shadow:.05em .05em 0 var(--pink)}         /* 글자용으로 한 톤 진한 파랑(흰 배경 대비 5.3:1) */
  .desc{margin:.8em auto 1.1em;max-width:28ch;font:500 clamp(12px,3vmin,15px)/1.5 var(--sans);color:#333}
  .btn{font:800 clamp(13px,3.2vmin,16px)/1 var(--sans);color:var(--ink);cursor:pointer;padding:.85em 1.3em;
    background:var(--yellow);border:var(--line) solid var(--ink);border-radius:999px;box-shadow:4px 4px 0 var(--ink);
    transition:translate .08s,box-shadow .08s,background-color .15s}
  .btn:hover{background:var(--teal)}
  .btn:active{translate:4px 4px;box-shadow:0 0 0 var(--ink)}
  .btn:focus-visible{outline:3px dashed var(--ink);outline-offset:4px}

  .tag{position:fixed;left:12px;bottom:12px;z-index:10;margin:0;font:600 11px/1 system-ui;letter-spacing:.04em;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;}

  @media (prefers-reduced-motion:reduce){
    .s,.s.spin{animation:none}                         /* 기본 각도(--r)로 고정된 정적 구성 */
    .s,.card{translate:none}
    .btn{transition:none}
  }
</style>
</head>
<body>
  <!-- 재사용 선 도형 정의 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <path id="sq" d="M8 22 Q23 -6 38 22 T68 22 T98 22 T128 22"/>
      <polyline id="zz" points="6,34 22,10 38,34 54,10 70,34 86,10 102,34 118,10"/>
      <path id="plus" d="M22 6V38M6 22H38"/>
    </defs>
  </svg>

  <div class="scene" aria-hidden="true">
    <svg class="s" viewBox="0 0 136 44" style="--x:5%;--y:9%;--w:26vmin;--d:.5;--t:7s;--r:-10deg"><use href="#sq" class="o"/><use href="#sq" class="f" style="--f:var(--pink)"/></svg>
    <svg class="s" viewBox="0 0 124 44" style="--x:64%;--y:6%;--w:24vmin;--d:.8;--t:9s;--r:8deg"><use href="#zz" class="o"/><use href="#zz" class="f" style="--f:var(--yellow)"/></svg>
    <svg class="s" viewBox="0 0 136 44" style="--x:58%;--y:80%;--w:22vmin;--d:.6;--t:8.5s;--r:6deg"><use href="#sq" class="o"/><use href="#sq" class="f" style="--f:var(--teal)"/></svg>
    <div class="s dots" style="--x:80%;--y:28%;--w:15vmin;--d:.3;--t:11s;--r:12deg"></div>
    <div class="s half" style="--x:3%;--y:38%;--w:17vmin;--d:.9;--t:8s;--r:24deg"></div>
    <div class="s ring" style="--x:81%;--y:62%;--w:15vmin;--d:.7;--t:10s"></div>
    <div class="s stripes" style="--x:9%;--y:70%;--w:16vmin;--d:.4;--t:12s;--r:-14deg"></div>
    <div class="s ball" style="--x:56%;--y:16%;--w:5vmin;--d:1.3;--t:6s;--f:var(--blue)"></div>
    <div class="s ball" style="--x:7%;--y:60%;--w:4vmin;--d:1.1;--t:7s;--f:var(--orange)"></div>
    <div class="s ball" style="--x:90%;--y:86%;--w:4.5vmin;--d:1.2;--t:6.5s;--f:var(--pink)"></div>
    <svg class="s spin" viewBox="0 0 44 44" style="--x:40%;--y:4%;--w:8vmin;--d:1;--t:18s"><polygon class="tri" points="22,5 40,37 4,37" style="--f:var(--teal)"/></svg>
    <svg class="s spin" viewBox="0 0 44 44" style="--x:90%;--y:46%;--w:6vmin;--d:1.1;--t:24s;--dir:reverse"><polygon class="tri" points="22,5 40,37 4,37" style="--f:var(--pink)"/></svg>
    <svg class="s spin" viewBox="0 0 44 44" style="--x:28%;--y:86%;--w:7vmin;--d:.8;--t:20s;--r:30deg"><polygon class="tri" points="22,5 40,37 4,37" style="--f:var(--blue)"/></svg>
    <svg class="s spin" viewBox="0 0 44 44" style="--x:24%;--y:20%;--w:8vmin;--d:1.2;--t:26s"><use href="#plus" class="o"/><use href="#plus" class="f" style="--f:var(--orange)"/></svg>
    <svg class="s spin" viewBox="0 0 44 44" style="--x:72%;--y:84%;--w:6vmin;--d:.9;--t:22s;--dir:reverse"><use href="#plus" class="o"/><use href="#plus" class="f" style="--f:var(--lilac)"/></svg>
  </div>

  <main class="demo">
    <article class="card">
      <div class="band" aria-hidden="true"></div>
      <p class="kicker">MEMPHIS · MILANO · 1981</p>
      <h1>대담하게,<br><span class="hl">재미있게!</span></h1>
      <p class="desc">규칙보다 재미. 80년대 멤피스 그룹의 유쾌한 반항을 웹으로.</p>
      <button class="btn" type="button">패턴 구경하기 →</button>
    </article>
  </main>
  <p class="tag">15 · Memphis Design</p>

  <script>
  /* ── 포인터 패럴랙스: 목표값을 향해 lerp, 다 따라붙으면 rAF 정지 ── */
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)');
  const root = document.documentElement;
  const FOLLOW = 0.08;                                 // 따라붙는 비율 (작을수록 느긋)
  let tx = 0, ty = 0, x = 0, y = 0, raf = 0;

  function loop() {
    x += (tx - x) * FOLLOW;
    y += (ty - y) * FOLLOW;
    root.style.setProperty('--mx', x.toFixed(3));
    root.style.setProperty('--my', y.toFixed(3));
    const moving = Math.abs(tx - x) + Math.abs(ty - y) > 0.002;
    raf = moving && !document.hidden ? requestAnimationFrame(loop) : 0;   // 숨겨지거나 도착하면 멈춤
  }
  function aim(nx, ny) {
    if (REDUCED.matches) return;
    tx = nx; ty = ny;
    if (!raf) raf = requestAnimationFrame(loop);
  }
  addEventListener('pointermove', e => aim(e.clientX / innerWidth * 2 - 1, e.clientY / innerHeight * 2 - 1), { passive: true });
  root.addEventListener('pointerleave', () => aim(0, 0));                   // 포인터가 나가면 제자리로
  </script>
</body>
</html>
